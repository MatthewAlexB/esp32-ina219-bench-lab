name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Analysis script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s labs/lab0-bring-up/analysis -v
      - run: python -m unittest discover -s labs/lab1-characterize-instrument/analysis -v

  firmware:
    name: Compile ESP32 sketches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit INA219"
      - name: Compile sketches
        run: |
          for s in labs/lab0-bring-up/firmware/i2c_scan \
                   labs/lab0-bring-up/firmware/ina219_logger \
                   labs/lab1-characterize-instrument/firmware/ina219_characterize \
                   labs/lab1-characterize-instrument/firmware/adc_vs_ina219; do
            arduino-cli compile --fqbn esp32:esp32:nodemcu-32s "$s"
          done
