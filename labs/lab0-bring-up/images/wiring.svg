<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-label="Wiring for Lab 0: current runs through the INA219 and all grounds meet on one breadboard rail" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
  </defs>
  <rect width="760" height="370" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#111111">Current runs through the INA219; all grounds meet on one rail</text>

  <rect x="24" y="56" width="140" height="140" rx="8" fill="none" stroke="#555555" stroke-width="1.25"/>
  <text x="94" y="80" text-anchor="middle" font-weight="600" fill="#111111">Bench supply</text>
  <text x="94" y="98" text-anchor="middle" font-size="11.5" fill="#666666">5 V, 0.10 A limit</text>
  <text x="152" y="122" text-anchor="end" fill="#111111">red (+)</text>
  <text x="94" y="186" text-anchor="middle" fill="#111111">black (&#8722;)</text>

  <rect x="250" y="56" width="200" height="140" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"/>
  <text x="350" y="80" text-anchor="middle" font-weight="600" fill="#111111">INA219</text>
  <text x="262" y="108" font-size="11.5" fill="#111111">Vin+</text>
  <text x="438" y="108" text-anchor="end" font-size="11.5" fill="#111111">Vin-</text>
  <rect x="310" y="106" width="80" height="24" rx="4" fill="none" stroke="#555555" stroke-width="1.25"/>
  <text x="350" y="122" text-anchor="middle" font-size="11.5" fill="#111111">shunt</text>
  <text text-anchor="middle" font-size="11.5" fill="#666666"><tspan x="350" y="148">current in at Vin+,</tspan><tspan x="350" y="162">out at Vin-</tspan></text>
  <text x="350" y="186" text-anchor="middle" fill="#111111">GND</text>

  <rect x="540" y="90" width="156" height="56" rx="8" fill="none" stroke="#555555" stroke-width="1.25"/>
  <text x="618" y="123" text-anchor="middle" font-weight="600" fill="#111111">220 &#937; load</text>

  <g fill="none" stroke="#555555" stroke-width="1.25">
    <path d="M164 118H250" marker-end="url(#arrow)"/>
    <path d="M250 118H310" marker-end="url(#arrow)"/>
    <path d="M390 118H450" marker-end="url(#arrow)"/>
    <path d="M450 118H540" marker-end="url(#arrow)"/>
  </g>
  <text x="207" y="108" text-anchor="middle" font-size="11.5" fill="#666666">red lead</text>
  <text x="495" y="108" text-anchor="middle" font-size="11.5" fill="#666666">jumper</text>

  <g fill="none" stroke="#555555" stroke-width="1.25">
    <path d="M94 196V244"/><path d="M350 196V244"/><path d="M618 146V244"/><path d="M250 290V244"/>
  </g>
  <line x1="24" y1="244" x2="736" y2="244" stroke="#555555" stroke-width="3"/>
  <circle cx="94" cy="244" r="4" fill="#555555"/><circle cx="250" cy="244" r="4" fill="#555555"/>
  <circle cx="350" cy="244" r="4" fill="#555555"/><circle cx="618" cy="244" r="4" fill="#555555"/>
  <text x="736" y="268" text-anchor="end" font-size="11.5" fill="#666666">Breadboard &#8722; rail (common ground)</text>

  <rect x="170" y="290" width="160" height="56" rx="8" fill="none" stroke="#555555" stroke-width="1.25"/>
  <text x="250" y="314" text-anchor="middle" font-weight="600" fill="#111111">NodeMCU-32S</text>
  <text x="250" y="332" text-anchor="middle" font-size="11.5" fill="#666666">GND pin</text>
</svg>
